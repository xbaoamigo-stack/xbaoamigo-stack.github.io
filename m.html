<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 胡總裁持股儀表板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }
        .header h1 {
            color: #667eea;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .header .subtitle {
            color: #666;
            font-size: 0.9rem;
        }
        .update-notice {
            background: #e8f5e9;
            border: 2px solid #4CAF50;
            color: #4CAF50;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .quote {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-style: italic;
            font-size: 0.95rem;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-card .label {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .summary-card .value {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .summary-card .change {
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .summary-card .change.up { color: #a5f3b0; }
        .summary-card .change.down { color: #ffadad; }
        .stock-list {
            margin-top: 15px;
        }
        .stock-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #667eea;
        }
        .stock-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .stock-card-header h3 {
            color: #333;
            font-size: 1.1rem;
        }
        .stock-card-header .code {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stock-info {
            background: white;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        .stock-info .label {
            color: #999;
            font-size: 0.65rem;
            margin-bottom: 4px;
        }
        .stock-info .value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }
        .stock-info .value.up { color: #4CAF50; }
        .stock-info .value.down { color: #f44336; }
        .caisen-analysis {
            background: #fff3e0;
            border-left: 3px solid #FF9800;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .caisen-analysis h4 {
            color: #FF9800;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .caisen-analysis ul {
            margin-left: 15px;
            color: #555;
            font-size: 0.8rem;
        }
        .caisen-analysis li {
            margin-bottom: 4px;
        }
        .recommendation {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .recommendation.buy {
            background: #e8f5e9;
            color: #4CAF50;
            border: 2px solid #4CAF50;
        }
        .recommendation.wait {
            background: #fff3e0;
            color: #FF9800;
            border: 2px solid #FF9800;
        }
        .recommendation.sell {
            background: #ffebee;
            color: #f44336;
            border: 2px solid #f44336;
        }
        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            color: #999;
            font-size: 0.75rem;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦞 胡總裁持股儀表板</h1>
            <p class="subtitle">蔡森理論 | 成本已更新</p>
        </div>

        <div class="update-notice">
            ✅ 2026-05-13 更新
        </div>

        <div class="quote">
            💬 「先知道會賠多少，再想賺多少」
        </div>

        <div id="dashboard"></div>

        <button class="refresh-btn" onclick="renderDashboard()">🔄 重新整理</button>

        <div class="footer">
            🦞 龍蝦投資系統 | 胡總裁專屬
        </div>
    </div>

    <script>
        // 胡總裁的真實持股（2026-05-13）
        const PORTFOLIO = [
            { code: '0050', name: '元大台灣 50', shares: 2271, avgCost: 75.09 },
            { code: '00878', name: '國泰永續高股息', shares: 4545, avgCost: 20.85 },
            { code: '00919', name: '群益台灣精選高息', shares: 2000, avgCost: 22.66 },
            { code: '00981A', name: '主動統一台股增長', shares: 1000, avgCost: 28.26 },
            { code: '2330', name: '台積電', shares: 50, avgCost: 2260.5 },
            { code: '2454', name: '聯發科', shares: 6, avgCost: 3430 },
            { code: '6859', name: '光聖', shares: 545, avgCost: 152.33 }
        ];

        // 目前股價（手動更新，可參考 Yahoo 股市）
        const CURRENT_PRICES = {
            '0050': { price: 95.2, change: 0.5 },
            '00878': { price: 27.93, change: 0.3 },
            '00919': { price: 25.53, change: 0.2 },
            '00981A': { price: 29.13, change: 0.1 },
            '2330': { price: 2215, change: -1.5 },
            '2454': { price: 3525, change: 0.5 },
            '6859': { price: 115, change: -2.0 }
        };

        // 蔡森建議價位
        const CAISEN_LEVELS = {
            '0050': { buy: 90, sell: 100, stop: 87, note: '定期定額持續' },
            '00878': { buy: 26, sell: 30, stop: 25, note: '定期定額持續' },
            '00919': { buy: 24, sell: 28, stop: 23, note: '定期定額持續' },
            '00981A': { buy: 27, sell: 32, stop: 26, note: '觀察走勢' },
            '2330': { buy: 2100, sell: 2400, stop: 2000, note: '回測可加碼' },
            '2454': { buy: 3300, sell: 4000, stop: 3200, note: '等待回測' },
            '6859': { buy: 140, sell: 160, stop: 110, note: '等待回穩' }
        };

        function formatCurrency(amount) {
            return '$' + amount.toLocaleString();
        }

        function getRecommendation(code, currentPrice) {
            const level = CAISEN_LEVELS[code];
            if (!level) return { class: 'wait', text: '⏳ 持續觀望' };

            if (currentPrice <= level.buy * 1.05) {
                return { class: 'buy', text: '✅ 建議買進' };
            } else if (currentPrice >= level.sell * 0.95) {
                return { class: 'sell', text: '⚠️ 考慮停利' };
            } else {
                return { class: 'wait', text: '⏳ 持續觀望' };
            }
        }

        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            
            // 計算持股數據
            const stocks = PORTFOLIO.map(stock => {
                const priceData = CURRENT_PRICES[stock.code] || { price: stock.avgCost, change: 0 };
                const marketValue = priceData.price * stock.shares;
                const costBasis = stock.avgCost * stock.shares;
                const profit = marketValue - costBasis;
                const profitPercent = (profit / costBasis) * 100;

                return {
                    ...stock,
                    currentPrice: priceData.price,
                    change: priceData.change,
                    marketValue,
                    costBasis,
                    profit,
                    profitPercent,
                    recommendation: getRecommendation(stock.code, priceData.price)
                };
            });

            // 計算總計
            const totalMarketValue = stocks.reduce((sum, s) => sum + s.marketValue, 0);
            const totalCostBasis = stocks.reduce((sum, s) => sum + s.costBasis, 0);
            const totalProfit = totalMarketValue - totalCostBasis;
            const totalProfitPercent = (totalProfit / totalCostBasis) * 100;

            const totalClass = totalProfit >= 0 ? 'up' : 'down';
            const totalSign = totalProfit >= 0 ? '+' : '';

            dashboard.innerHTML = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="label">總市值</div>
                        <div class="value">${formatCurrency(totalMarketValue)}</div>
                    </div>
                    <div class="summary-card">
                        <div class="label">總成本</div>
                        <div class="value">${formatCurrency(totalCostBasis)}</div>
                    </div>
                    <div class="summary-card">
                        <div class="label">總損益</div>
                        <div class="value">${formatCurrency(totalProfit)}</div>
                        <div class="change ${totalClass}">${totalSign}${totalProfitPercent.toFixed(2)}%</div>
                    </div>
                    <div class="summary-card">
                        <div class="label">持股數</div>
                        <div class="value">${stocks.length} 檔</div>
                    </div>
                </div>

                <div class="stock-list">
                    ${stocks.map(stock => {
                        const profitClass = stock.profit >= 0 ? 'up' : 'down';
                        const profitSign = stock.profit >= 0 ? '+' : '';
                        const changeClass = stock.change >= 0 ? 'up' : 'down';

                        return `
                            <div class="stock-card">
                                <div class="stock-card-header">
                                    <h3>${stock.name}</h3>
                                    <span class="code">${stock.code}</span>
                                </div>
                                <div class="stock-grid">
                                    <div class="stock-info">
                                        <div class="label">股價</div>
                                        <div class="value">${stock.currentPrice.toLocaleString()}</div>
                                    </div>
                                    <div class="stock-info">
                                        <div class="label">漲跌</div>
                                        <div class="value ${changeClass}">${stock.change >= 0 ? '▲' : '▼'}${Math.abs(stock.change)}%</div>
                                    </div>
                                    <div class="stock-info">
                                        <div class="label">持股</div>
                                        <div class="value">${stock.shares.toLocaleString()}</div>
                                    </div>
                                    <div class="stock-info">
                                        <div class="label">成本</div>
                                        <div class="value">${stock.avgCost.toLocaleString()}</div>
                                    </div>
                                    <div class="stock-info">
                                        <div class="label">市值</div>
                                        <div class="value">${formatCurrency(stock.marketValue)}</div>
                                    </div>
                                    <div class="stock-info">
                                        <div class="label">損益</div>
                                        <div class="value ${profitClass}">${profitSign}${formatCurrency(stock.profit)}</div>
                                    </div>
                                </div>
                                <div class="caisen-analysis">
                                    <h4>🦞 蔡森分析</h4>
                                    <ul>
                                        <li>加碼：$${CAISEN_LEVELS[stock.code]?.buy} - ${CAISEN_LEVELS[stock.code]?.note}</li>
                                        <li>停利：$${CAISEN_LEVELS[stock.code]?.sell}</li>
                                        <li>停損：$${CAISEN_LEVELS[stock.code]?.stop}</li>
                                    </ul>
                                </div>
                                <div class="recommendation ${stock.recommendation.class}">${stock.recommendation.text}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 初始載入
        renderDashboard();
    </script>
</body>
</html>
